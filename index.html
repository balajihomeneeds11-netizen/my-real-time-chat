<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real-Time Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222
}
.app{
  max-width:900px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:white
}
header{
  background:#1769aa;
  color:white;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
header h2{margin:0;font-size:20px}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold
}
.primary{background:#1769aa;color:white}
.danger{background:#d32f2f;color:white}
.gray{background:#ddd;color:#222}
.roombar{
  padding:10px;
  background:#eef2f5;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.roombar select{padding:9px;flex:1;min-width:150px}
.messages{
  flex:1;
  overflow:auto;
  padding:15px
}
.msg{
  max-width:78%;
  padding:10px 13px;
  margin:8px 0;
  border-radius:12px;
  background:#e9edf1
}
.me{
  margin-left:auto;
  background:#d5f5df
}
.name{
  font-size:11px;
  font-weight:bold;
  color:#555;
  margin-bottom:4px
}
.time{
  font-size:10px;
  color:#777;
  margin-top:5px
}
.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #ddd
}
.composer input{
  flex:1;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px
}
.panel{
  display:none;
  padding:15px;
  border-top:1px solid #ddd;
  background:#fff3e0
}
.panel h3{margin-top:0}
input,select{
  padding:10px;
  border:1px solid #bbb;
  border-radius:7px
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px
}
.status{
  padding:6px 12px;
  font-size:12px;
  color:#555
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10
}
.modalbox{
  background:white;
  padding:22px;
  border-radius:12px;
  width:90%;
  max-width:400px
}
.modalbox input{
  width:100%;
  margin:8px 0
}
.hidden{display:none!important}
.small{font-size:12px;color:#666}
</style>
</head>

<body>

<div class="app">

<header>
  <h2>💬 Real-Time Chat</h2>
  <button class="gray" onclick="toggleDeveloper()">Developer</button>
</header>

<div class="roombar">
  <select id="roomSelect" onchange="changeRoom()"></select>
  <button class="primary" onclick="joinRoom()">Join</button>
  <button class="gray" onclick="showRooms()">Rooms</button>
</div>

<div class="status" id="status">Connecting...</div>

<div id="messages" class="messages"></div>

<div class="composer">
  <input id="messageInput" placeholder="Type a message..." maxlength="500">
  <button class="primary" onclick="sendMessage()">Send</button>
</div>

<div id="developerPanel" class="panel">
  <h3>👨‍💻 Developer Controls</h3>

  <div class="row">
    <input id="newRoomName" placeholder="New room name">
    <input id="newRoomPassword" placeholder="Room password" type="password">
    <button class="primary" onclick="createRoom()">Create Room</button>
  </div>

  <div class="row">
    <button class="danger" onclick="deleteCurrentRoom()">Delete Current Room</button>
    <button class="gray" onclick="clearMessages()">Clear Messages</button>
  </div>

  <p class="small">
    Developer mode controls room creation, deletion and message moderation.
  </p>
</div>

</div>

<!-- USER SETUP -->
<div id="userModal" class="modal">
  <div class="modalbox">
    <h2>Welcome 👋</h2>
    <p>Choose your username.</p>
    <input id="usernameInput" placeholder="Username" maxlength="30">
    <button class="primary" onclick="saveUsername()">Continue</button>
  </div>
</div>

<!-- ROOM PASSWORD -->
<div id="passwordModal" class="modal hidden">
  <div class="modalbox">
    <h2>🔐 Private Room</h2>
    <p>This room requires a password.</p>
    <input id="roomPasswordInput" type="password" placeholder="Room password">
    <button class="primary" onclick="verifyRoomPassword()">Enter Room</button>
    <button class="gray" onclick="closePassword()">Cancel</button>
  </div>
</div>

<!-- DEVELOPER LOGIN -->
<div id="developerModal" class="modal hidden">
  <div class="modalbox">
    <h2>👨‍💻 Developer Login</h2>
    <input id="developerPassword" type="password" placeholder="Developer password">
    <button class="primary" onclick="developerLogin()">Login</button>
    <button class="gray" onclick="closeDeveloper()">Cancel</button>
    <p class="small">Change the developer password in the code before production.</p>
  </div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDO9XtgudI-IXQQ-SaRDGY_YuVRsNoirbg",
  authDomain: "my-real-time-chat-81f65.firebaseapp.com",
  databaseURL: "https://my-real-time-chat-81f65-default-rtdb.firebaseio.com",
  projectId: "my-real-time-chat-81f65",
  storageBucket: "my-real-time-chat-81f65.firebasestorage.app",
  messagingSenderId: "432054593558",
  appId: "1:432054593558:web:dcfde041c5d42e03612d37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* =========================
   SETTINGS
========================= */

const DEVELOPER_PASSWORD = "Admin12345";

let username = localStorage.getItem("chatUsername");
let currentRoom = localStorage.getItem("chatRoom") || "";
let pendingRoom = "";
let developerMode = false;
let roomListener = null;


/* =========================
   USERNAME
========================= */

function saveUsername(){
  const name=document.getElementById("usernameInput").value.trim();

  if(!name){
    alert("Enter a username");
    return;
  }

  username=name;
  localStorage.setItem("chatUsername",name);

  document.getElementById("userModal").classList.add("hidden");

  loadRooms();
}

window.saveUsername=saveUsername;


/* =========================
   LOAD ROOMS
========================= */

async function loadRooms(){

  const roomsRef=ref(db,"rooms");
  const snap=await get(roomsRef);

  const select=document.getElementById("roomSelect");
  select.innerHTML="";

  if(!snap.exists()){

    await set(ref(db,"rooms/general"),{
      name:"General",
      password:"",
      createdAt:Date.now()
    });

  }

  const snap2=await get(roomsRef);

  snap2.forEach(child=>{

    const data=child.val();

    const option=document.createElement("option");

    option.value=child.key;
    option.textContent=
      data.name + (data.password ? " 🔐" : "");

    select.appendChild(option);

  });

  if(currentRoom && snap2.hasChild(currentRoom)){
    select.value=currentRoom;
  }else{
    currentRoom=select.value;
    localStorage.setItem("chatRoom",currentRoom);
  }

  joinRoom();
}


/* =========================
   CHANGE ROOM
========================= */

function changeRoom(){
  pendingRoom=document.getElementById("roomSelect").value;

  get(ref(db,"rooms/"+pendingRoom)).then(snap=>{

    if(!snap.exists())return;

    const room=snap.val();

    if(room.password){
      document.getElementById("roomPasswordInput").value="";
      document.getElementById("passwordModal").classList.remove("hidden");
    }else{
      openRoom(pendingRoom);
    }

  });
}

window.changeRoom=changeRoom;


/* =========================
   PASSWORD VERIFY
========================= */

async function verifyRoomPassword(){

  const password=
    document.getElementById("roomPasswordInput").value;

  const snap=await get(ref(db,"rooms/"+pendingRoom));

  if(!snap.exists()){
    alert("Room not found");
    return;
  }

  if(snap.val().password!==password){
    alert("Wrong password");
    return;
  }

  document.getElementById("passwordModal")
    .classList.add("hidden");

  openRoom(pendingRoom);
}

window.verifyRoomPassword=verifyRoomPassword;


function closePassword(){
  document.getElementById("passwordModal")
    .classList.add("hidden");

  document.getElementById("roomSelect").value=currentRoom;
}

window.closePassword=closePassword;


/* =========================
   OPEN ROOM
========================= */

function openRoom(roomId){

  currentRoom=roomId;

  localStorage.setItem("chatRoom",roomId);

  document.getElementById("messages").innerHTML="";

  if(roomListener){
    roomListener();
  }

  const messagesRef=
    ref(db,"rooms/"+roomId+"/messages");

  roomListener=onValue(messagesRef,snap=>{

    const box=document.getElementById("messages");

    box.innerHTML="";

    snap.forEach(child=>{

      const msg=child.val();

      const div=document.createElement("div");

      div.className=
        "msg "+(msg.username===username ? "me":"");

      div.innerHTML=`
        <div class="name">${escapeHTML(msg.username)}</div>
        <div>${escapeHTML(msg.text)}</div>
        <div class="time">
          ${new Date(msg.time).toLocaleString()}
          ${
            developerMode
            ? `<button class="danger"
                style="padding:3px 6px;margin-left:5px"
                onclick="deleteMessage('${child.key}')">
                Delete
              </button>`
            : ""
          }
        </div>
      `;

      box.appendChild(div);

    });

    box.scrollTop=box.scrollHeight;

  });

  get(ref(db,"rooms/"+roomId)).then(snap=>{

    if(snap.exists()){
      document.getElementById("status").textContent=
        "Room: "+snap.val().name;
    }

  });
}

window.joinRoom=()=>{

  const room=document.getElementById("roomSelect").value;

  get(ref(db,"rooms/"+room)).then(snap=>{

    if(snap.val().password){
      pendingRoom=room;
      document.getElementById("passwordModal")
        .classList.remove("hidden");
    }else{
      openRoom(room);
    }

  });

};


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input=document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  if(!username){
    alert("Choose a username first");
    return;
  }

  if(!currentRoom){
    alert("Choose a room");
    return;
  }

  await push(
    ref(db,"rooms/"+currentRoom+"/messages"),
    {
      username:username,
      text:text,
      time:Date.now()
    }
  );

  input.value="";
}

window.sendMessage=sendMessage;


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

  if(!developerMode){
    alert("Developer access required");
    return;
  }

  const name=
    document.getElementById("newRoomName").value.trim();

  const password=
    document.getElementById("newRoomPassword").value;

  if(!name){
    alert("Enter room name");
    return;
  }

  const id=name
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");

  if(!id){
    alert("Invalid room name");
    return;
  }

  const existing=
    await get(ref(db,"rooms/"+id));

  if(existing.exists()){
    alert("Room already exists");
    return;
  }

  await set(ref(db,"rooms/"+id),{
    name:name,
    password:password,
    createdAt:Date.now(),
    createdBy:username
  });

  alert("Room created!");

  document.getElementById("newRoomName").value="";
  document.getElementById("newRoomPassword").value="";

  loadRooms();
}

window.createRoom=createRoom;


/* =========================
   DELETE ROOM
========================= */

async function deleteCurrentRoom(){

  if(!developerMode){
    alert("Developer access required");
    return;
  }

  if(currentRoom==="general"){
    alert("General room cannot be deleted");
    return;
  }

  if(!confirm("Delete this room and all its messages?")){
    return;
  }

  await remove(ref(db,"rooms/"+currentRoom));

  currentRoom="";

  loadRooms();
}

window.deleteCurrentRoom=deleteCurrentRoom;


/* =========================
   DELETE MESSAGE
========================= */

async function deleteMessage(id){

  if(!developerMode){
    alert("Developer access required");
    return;
  }

  if(!confirm("Delete this message?")){
    return;
  }

  await remove(
    ref(db,
      "rooms/"+currentRoom+"/messages/"+id
    )
  );
}

window.deleteMessage=deleteMessage;


/* =========================
   CLEAR MESSAGES
========================= */

async function clearMessages(){

  if(!developerMode){
    alert("Developer access required");
    return;
  }

  if(!confirm("Delete ALL messages in this room?")){
    return;
  }

  await remove(
    ref(db,"rooms/"+currentRoom+"/messages")
  );
}

window.clearMessages=clearMessages;


/* =========================
   DEVELOPER LOGIN
========================= */

function toggleDeveloper(){

  if(developerMode){

    developerMode=false;

    document.getElementById("developerPanel")
      .style.display="none";

    alert("Developer mode disabled");

    if(currentRoom)openRoom(currentRoom);

  }else{

    document.getElementById("developerModal")
      .classList.remove("hidden");

  }

}

window.toggleDeveloper=toggleDeveloper;


function developerLogin(){

  const password=
    document.getElementById("developerPassword").value;

  if(password!==DEVELOPER_PASSWORD){

    alert("Wrong developer password");
    return;

  }

  developerMode=true;

  document.getElementById("developerModal")
    .classList.add("hidden");

  document.getElementById("developerPanel")
    .style.display="block";

  document.getElementById("developerPassword").value="";

  if(currentRoom)openRoom(currentRoom);
}

window.developerLogin=developerLogin;


function closeDeveloper(){

  document.getElementById("developerModal")
    .classList.add("hidden");

}

window.closeDeveloper=closeDeveloper;


/* =========================
   ROOMS
========================= */

async function showRooms(){

  const snap=await get(ref(db,"rooms"));

  let text="Available rooms:\n\n";

  snap.forEach(child=>{
    text+=
      "• "+child.val().name+
      (child.val().password ? " 🔐":"")+
      "\n";
  });

  alert(text);
}

window.showRooms=showRooms;


/* =========================
   SECURITY: DISPLAY TEXT
========================= */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

if(!username){

  document.getElementById("userModal")
    .classList.remove("hidden");

}else{

  document.getElementById("userModal")
    .classList.add("hidden");

  loadRooms();

}


/* ENTER TO SEND */

document.getElementById("messageInput")
.addEventListener("keydown",e=>{

  if(e.key==="Enter"){
    sendMessage();
  }

});

</script>

</body>
</html>
